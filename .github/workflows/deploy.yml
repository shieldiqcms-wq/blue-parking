name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# صلاحيات النشر على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# تشغيل واحد في كل مرة، بدون إلغاء نشر جارٍ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: البناء
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # تُقرأ من GitHub > Settings > Secrets and variables > Actions
          # VITE_SUPABASE_URL          -> Variables (قيمة عامة)
          # VITE_SUPABASE_PUBLISHABLE_KEY -> Variables أو Secrets
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL غير مضبوط. أضفه في Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY غير مضبوط. أضفه في Settings > Secrets and variables > Actions"
            exit 1
          fi
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: النشر
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
