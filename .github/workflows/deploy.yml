name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# صلاحيات النشر على GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# تشغيل واحد في كل مرة، بدون إلغاء نشر جارٍ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: البناء
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # تُقرأ من GitHub > Settings > Secrets and variables > Actions
          # VITE_SUPABASE_URL          -> Variables (قيمة عامة)
          # VITE_SUPABASE_PUBLISHABLE_KEY -> Variables أو Secrets
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # --- VITE_SUPABASE_URL ---
          [ -n "$VITE_SUPABASE_URL" ] || fail \
            "VITE_SUPABASE_URL غير مضبوط. أضفه في Settings > Secrets and variables > Actions > Variables"

          # الخطأ الشائع: نسخ رابط لوحة التحكم من شريط العنوان بدل رابط الـ API.
          # هذا يُنتج نسخة تفشل بخطأ CORS غامض عند تسجيل الدخول، فنكتشفه هنا.
          case "$VITE_SUPABASE_URL" in
            *supabase.com*) fail \
              "VITE_SUPABASE_URL هو رابط لوحة التحكم، وليس رابط الـ API. المطلوب https://<project-ref>.supabase.co من Project Settings > Data API > Project URL" ;;
          esac

          echo "$VITE_SUPABASE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+/?$' || fail \
            "صيغة VITE_SUPABASE_URL غير صحيحة: '$VITE_SUPABASE_URL' — المطلوب https://<project-ref>.supabase.co بلا أي مسار"

          # --- VITE_SUPABASE_PUBLISHABLE_KEY ---
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || fail \
            "VITE_SUPABASE_PUBLISHABLE_KEY غير مضبوط. أضفه في Settings > Secrets and variables > Actions"

          # منع نشر مفتاح سري في واجهة عامة
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*) fail \
              "VITE_SUPABASE_PUBLISHABLE_KEY يحتوي مفتاحاً سرياً — هذا يتجاوز كل سياسات الحماية. ألغِ المفتاح من لوحة Supabase واستخدم المفتاح العام (Publishable)" ;;
          esac

          echo "✓ إعدادات الاتصال صحيحة — المشروع: ${VITE_SUPABASE_URL}"
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: النشر
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
